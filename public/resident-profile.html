<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple Apartments - Resident Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <div class="flex">
        <!-- Sidebar -->
        <aside class="fixed inset-y-0 left-0 w-64 bg-white border-r hidden lg:block">
            <div class="p-8">
                <div class="flex items-center gap-3 text-orange-600 font-bold text-xl mb-12">
                    <i class="fa-solid fa-hand-holding-dollar w-6 text-center"></i> Defaulters Admin
                </div>
                <nav class="space-y-1">
                    <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-100 font-semibold transition-all">
                        <i class="fa-solid fa-chart-pie w-6 text-center"></i> Overview
                    </a>

                    <a href="admin-dashboard.html#complaintsBox" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-100 font-semibold transition-all">
                        <i class="fa-solid fa-triangle-exclamation w-6 text-center"></i> Complaints Box
                    </a>
                    <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-100 font-semibold transition-all">
                        <i class="fa-solid fa-gear w-6 text-center"></i> Settings
                    </a>
                </nav>
            </div>
            <div class="absolute bottom-0 w-full p-6 border-t">
                <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 font-bold hover:bg-red-50"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-64 bg-gray-50 min-h-screen">
            <!-- Header Section -->
            <div class="bg-orange-600 p-20 text-white text-center">
                <a href="residents.html" class="absolute top-8 left-[280px] inline-flex items-center gap-2 text-white/70 hover:text-white transition-all font-bold text-xs uppercase tracking-widest border border-white/20 px-4 py-2 rounded-xl">
                    <i class="fa-solid fa-arrow-left"></i> Back to Residents
                </a>
                <h1 id="headerRoom" class="text-8xl font-black mb-2 leading-none tracking-tighter">—</h1>
                <p id="headerName" class="text-orange-100 font-black text-2xl uppercase tracking-[0.2em] opacity-80">Loading...</p>
            </div>

            <div class="p-10 -mt-16 space-y-10">
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-10">
                    <!-- Profile Info -->
                    <div class="bg-white rounded-[48px] p-12 shadow-sm border border-gray-100 col-span-2">
                        <div class="flex items-center justify-between mb-12">
                            <h2 class="text-2xl font-black italic">Resident Lifecycle</h2>
                            <span id="badgeOccupancy" class="px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest">Status</span>
                        </div>
                        <div class="grid grid-cols-2 gap-y-12 gap-x-8">
                            <div><p class="text-[10px] uppercase tracking-widest text-gray-400 font-black mb-2">Phone</p><p id="fieldPhone" class="font-bold text-xl text-gray-900">—</p></div>
                            <div><p class="text-[10px] uppercase tracking-widest text-gray-400 font-black mb-2">Email</p><p id="fieldEmail" class="font-bold text-xl text-gray-900">—</p></div>
                            <div><p class="text-[10px] uppercase tracking-widest text-gray-400 font-black mb-2">Emergency</p><p id="fieldEmergency" class="font-bold text-gray-900">—</p></div>
                            <div><p class="text-[10px] uppercase tracking-widest text-gray-400 font-black mb-2">Move-In</p><p id="fieldMoveIn" class="font-bold text-gray-900">—</p></div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="bg-gray-900 rounded-[48px] p-12 text-white flex flex-col justify-between shadow-2xl">
                        <div><h3 class="text-xl font-black text-orange-500 mb-2">Management</h3><p class="text-xs text-gray-400 italic">Modify or archive recorded data</p></div>
                        <div class="space-y-4">
                            <button class="w-full py-5 bg-white/10 hover:bg-white text-white hover:text-gray-900 rounded-3xl text-[10px] font-black uppercase tracking-widest transition-all">Edit Details</button>
                            <button id="vacateBtn" class="w-full py-5 bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white rounded-3xl text-[10px] font-black uppercase tracking-widest transition-all">Mark Vacated</button>
                        </div>
                    </div>
                </div>

                <!-- History -->
                <div class="bg-white rounded-[48px] p-12 shadow-sm border border-gray-100 overflow-hidden">
                    <h2 class="text-2xl font-black italic mb-10 text-gray-900">Payment Timeline</h2>
                    <table class="w-full text-left">
                        <thead class="bg-gray-50/50 text-gray-400 text-[10px] uppercase tracking-widest font-black">
                            <tr><th class="px-8 py-6">Month Cycle</th><th class="px-8 py-6">Amount</th><th class="px-8 py-6">Status</th><th class="px-8 py-6">Date Paid</th></tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-gray-50 font-bold"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');

        async function loadProfile() {
            try {
                const res = await fetch(`/api/residents`);
                const all = await res.json();
                const room = all.find(r => r._id === roomId);
                if (!room) return alert('Data not found');
                renderProfile(room);
                loadHistory(room.flat_number);
            } catch (err) { console.error(err); }
        }

        function renderProfile(room) {
            document.getElementById('headerRoom').textContent = room.flat_number;
            document.getElementById('headerName').textContent = room.resident?.name || 'Vacant';
            document.getElementById('fieldPhone').textContent = room.resident?.phone || 'Not provided';
            document.getElementById('fieldEmail').textContent = room.resident?.email || 'Not provided';
            document.getElementById('fieldEmergency').textContent = room.resident?.emergencyContact || 'Not provided';
            document.getElementById('fieldMoveIn').textContent = room.resident?.moveInDate ? new Date(room.resident?.moveInDate).toLocaleDateString('en-GB') : '—';
            
            const badge = document.getElementById('badgeOccupancy');
            badge.className = `px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest ${room.isOccupied ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`;
            badge.textContent = room.isOccupied ? 'Active Resident' : 'Vacated';
            document.getElementById('vacateBtn').onclick = () => handleVacate(room._id);
        }

        async function loadHistory(flat) {
            const res = await fetch(`/api/rooms/${flat}/history`);
            const history = await res.json();
            const body = document.getElementById('historyTableBody');
            history.reverse().forEach(h => {
                body.innerHTML += `
                    <tr class="text-sm">
                        <td class="px-8 py-6">${h.month}</td>
                        <td class="px-8 py-6">₹${h.amount}</td>
                        <td class="px-8 py-6"><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest">Verified</span></td>
                        <td class="px-8 py-6 text-gray-400 italic">${new Date(h.paidDate).toLocaleDateString('en-GB')}</td>
                    </tr>
                `;
            });
        }

        async function handleVacate(id) {
            if(confirm('Are you sure you want to mark this resident as vacated?')) {
                await fetch(`/api/residents/${id}/vacate`, { method: 'POST' });
                window.location.reload();
            }
        }
        window.onload = loadProfile;
    </script>
</body>
</html>
