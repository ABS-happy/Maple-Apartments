<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple Apartments - Login</title>
    <link rel="stylesheet" href="styles.css">

    <!-- PWA Support -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        window.deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredInstallPrompt = e;
            console.log('[PWA] Early beforeinstallprompt captured!');
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceWorker.js', { scope: '/' })
                    .then(reg => console.log('Service Worker Registered with scope:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }
    </script>
</head>

<body>
    <!-- Top Corner Logo -->
    <div class="top-corner-logo">
        <i class="fa-solid fa-leaf logo-icon"></i>
        <span>Maple Apartments</span>
    </div>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo removed from here to top corner -->
            <div class="header-text">
                <h1>Welcome to Maple Apartments</h1>
                <p>Sign in to your apartment portal</p>
            </div>

            <!-- Success Message Box -->
            <div id="login-success-message" class="hidden" style="margin-bottom: 1.5rem; color: #16a34a; background-color: #dcfce7; padding: 1rem; border-radius: 8px; text-align: center; border: 1px solid #bbf7d0;">
                <i class="fa-solid fa-circle-check" style="margin-right: 0.5rem;"></i>
                Registration successfully done! Please login.
            </div>

            <!-- Error Message Box -->
            <div class="error-message hidden" id="error-message">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text">Invalid login credentials. Please try again.</span>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <!-- User ID -->
                <div class="input-group">
                    <label for="username">User ID <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="username" placeholder="Enter your User ID">
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Enter your password">
                        <!-- Password Masking Toggle -->
                        <button type="button" class="toggle-password" id="togglePassword"
                            aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="form-actions">
                    <a href="reset-password.html" class="forgot-password">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="submit-btn" id="loginBtn">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="auth-divider">
                    <span>or continue with</span>
                </div>

                <!-- Google OAuth Button -->
                <button type="button" class="btn-google-auth" id="googleLoginBtn" onclick="window.continueWithGoogle()" title="Sign in with Google">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>

            </form>

            <!-- Simple WebApp Download Button -->
            <button type="button" id="downloadAppBtn" class="btn-download-app" onclick="window.downloadWebAppDirect()" title="Download Maple WebApp">
                <i class="fa-solid fa-download"></i>
                <span>Download App</span>
            </button>

            <!-- Register Link -->
            <div class="card-footer" style="margin-top: 1.5rem;">
                <p>Don't have an account? <a href="register.html" class="register-link">Register New Owner</a></p>
            </div>
        </div>

        <!-- Page Footer -->
        <footer class="page-footer">
            <p>&copy; 2026 Maple Apartments. All Rights Reserved.</p>
        </footer>
    </div>


    <script src="script.js"></script>

</body>

</html>
