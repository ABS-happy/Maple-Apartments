<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple Apartments - Real-Time Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .row-paid { background-color: #f0fdf4; border-left: 4px solid #22c55e !important; }
        .row-unpaid { background-color: #fef2f2; border-left: 4px solid #ef4444 !important; }
        .modal-active { display: flex !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <div class="flex">
        <!-- Sidebar -->
        <aside class="fixed inset-y-0 left-0 w-64 bg-white border-r hidden lg:block">
            <div class="p-8">
                <div class="flex items-center gap-3 text-orange-600 font-bold text-xl mb-12">
                    <i class="fa-solid fa-crown text-2xl"></i> Maple Admin
                </div>
                <nav class="space-y-1">
                    <a href="admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-100 font-semibold transition-all">
                        <i class="fa-solid fa-chart-pie w-6 text-center"></i> Overview
                    </a>
                    <a href="admin-dashboard.html#complaintsBox" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-100 font-semibold transition-all">
                        <i class="fa-solid fa-triangle-exclamation w-6 text-center"></i> Complaints Box
                    </a>
                    <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-100 font-semibold transition-all">
                        <i class="fa-solid fa-gear w-6 text-center"></i> Settings
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-64 p-4 lg:p-10">
            <div class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-8">
                <div>
                    <h1 class="text-3xl font-black tracking-tighter italic">Billing Dashboard</h1>
                    <p class="text-sm text-gray-400 font-bold uppercase tracking-widest mt-1">Global & Unit Control Active</p>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-orange-100 flex items-center gap-4">
                        <div class="w-10 h-10 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-plus"></i></div>
                        <div>
                            <label class="text-[10px] uppercase font-black text-gray-400 mb-1">Extra Charges (₹)</label>
                            <input type="number" id="extraChargesInput" value="0" class="w-32 bg-gray-50 border-none rounded-lg px-2 font-bold text-orange-600 outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Summary -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 text-white">
                <div class="bg-gray-900 p-8 rounded-[38px] shadow-sm"><p class="text-[10px] uppercase font-black opacity-50 mb-2 tracking-widest">Expected</p><h3 id="summaryExpected" class="text-3xl font-black italic">₹0</h3></div>
                <div class="bg-orange-600 p-8 rounded-[38px] shadow-xl"><p class="text-[10px] uppercase font-black opacity-70 mb-2 tracking-widest">Collected</p><h3 id="summaryCollected" class="text-3xl font-black italic">₹0</h3></div>
                <div class="bg-red-600 p-8 rounded-[38px] shadow-xl"><p class="text-[10px] uppercase font-black opacity-70 mb-2 tracking-widest">Pending</p><h3 id="summaryPending" class="text-3xl font-black italic">₹0</h3></div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-[40px] shadow-sm border border-gray-100 overflow-hidden min-h-[500px]">
                <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/60 backdrop-blur-md z-10 items-center justify-center flex-col gap-4">
                    <div class="w-12 h-12 border-4 border-orange-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="font-black uppercase text-xs text-orange-600 tracking-widest">Updating Ledger...</p>
                </div>
                <table class="w-full text-left">
                    <thead class="bg-gray-50/50 text-gray-400 text-[10px] uppercase tracking-widest font-black">
                        <tr>
                            <th class="px-8 py-6">Room Details</th>
                            <th class="px-8 py-6">Maint.</th>
                            <th class="px-8 py-6">Parking</th>
                            <th class="px-8 py-6">Extra</th>
                            <th class="px-8 py-6">Monthly Total</th>
                            <th class="px-8 py-6">Status</th>
                            <th class="px-8 py-6 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="billingTableBody" class="font-bold text-sm divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Edit Charge Modal -->
    <div id="editModal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[48px] p-10 max-w-md w-full shadow-2xl space-y-8">
            <div>
                <h2 class="text-2xl font-black italic mb-1">Set Unit Charges</h2>
                <p id="modalUnit" class="text-xs text-orange-600 font-black uppercase tracking-widest tracking-tighter">Room —</p>
            </div>
            
            <input type="hidden" id="editRoomId">
            <div class="space-y-6 text-xs font-black uppercase tracking-widest text-gray-400">
                <div class="space-y-2">
                    <label>Monthly Maintenance (₹)</label>
                    <input type="number" id="editMaint" class="w-full bg-gray-50 border-none rounded-2xl px-6 py-4 text-gray-900 text-lg outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="space-y-2">
                    <label>Parking Fee (₹)</label>
                    <input type="number" id="editPark" class="w-full bg-gray-50 border-none rounded-2xl px-6 py-4 text-gray-900 text-lg outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>

            <div class="flex gap-4 pt-4">
                <button onclick="closeModal()" class="flex-1 py-4 bg-gray-100 text-gray-400 rounded-2xl font-black uppercase tracking-widest">Cancel</button>
                <button onclick="saveCharges()" class="flex-1 py-4 bg-orange-600 text-white rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-orange-100">Save Update</button>
            </div>
        </div>
    </div>

    <script>
        let liveData = [];
        const token = sessionStorage.getItem('maple_token');

        async function fetchRealData() {
            setLoading(true);
            try {
                // Fetch residents to get the real Maintenance/Parking charge IDs
                const res = await fetch('/api/residents', { headers: { 'Authorization': `Bearer ${token}` } });
                const residents = await res.json();
                
                const billRes = await fetch('/api/bills');
                const bills = await billRes.json();

                liveData = residents.map(r => {
                    const bill = bills.find(b => b.flat_number === r.flat_number);
                    return {
                        id: r._id,
                        room: r.flat_number,
                        name: r.resident?.name || 'Vacant',
                        maintenance: r.maintenance_charge || 0,
                        parking: r.parking_charge || 0,
                        status: bill ? bill.status : 'Unpaid'
                    };
                });
                renderBilling();
            } catch (err) { console.error(err); }
            finally { setLoading(false); }
        }

        function renderBilling() {
            const extra = parseInt(document.getElementById('extraChargesInput').value) || 0;
            const body = document.getElementById('billingTableBody');
            body.innerHTML = '';
            let exp = 0, col = 0, pen = 0;

            liveData.forEach((item) => {
                const total = item.maintenance + item.parking + extra;
                exp += total;
                if(item.status === 'Paid') col += total; else pen += total;

                body.innerHTML += `
                    <tr class="${item.status === 'Paid' ? 'row-paid' : 'row-unpaid'} transition-all border-b border-gray-50">
                        <td class="px-8 py-6">
                            <div class="font-black text-gray-900 flex items-center gap-3">
                                ${item.room}
                                <button onclick="openEditModal('${item.id}', '${item.room}', ${item.maintenance}, ${item.parking})" class="text-gray-300 hover:text-orange-500 transition-all text-xs">
                                    <i class="fa-solid fa-gear"></i>
                                </button>
                            </div>
                            <p class="text-[10px] text-gray-400 uppercase tracking-widest truncate max-w-[100px]">${item.name}</p>
                        </td>
                        <td class="px-8 py-6 text-gray-500">₹${item.maintenance}</td>
                        <td class="px-8 py-6 text-gray-500">₹${item.parking}</td>
                        <td class="px-8 py-6 text-orange-600">+ ₹${extra}</td>
                        <td class="px-8 py-6 font-black text-lg">₹${total}</td>
                        <td class="px-8 py-6">
                            <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest ${item.status === 'Paid' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                ${item.status}
                            </span>
                        </td>
                        <td class="px-8 py-6 text-right">
                            <button onclick="togglePayment('${item.room}', '${item.status}', ${total})" class="bg-gray-900 text-white px-5 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-orange-600 transition-all active:scale-95 shadow-lg">
                                ${item.status === 'Paid' ? 'Revert' : 'Record Paid'}
                            </button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('summaryExpected').textContent = `₹${exp}`;
            document.getElementById('summaryCollected').textContent = `₹${col}`;
            document.getElementById('summaryPending').textContent = `₹${pen}`;
        }

        function openEditModal(id, room, maint, park) {
            document.getElementById('editRoomId').value = id;
            document.getElementById('modalUnit').textContent = `Unit ${room} Charges`;
            document.getElementById('editMaint').value = maint;
            document.getElementById('editPark').value = park;
            document.getElementById('editModal').classList.add('modal-active');
        }

        async function saveCharges() {
            setLoading(true);
            const id = document.getElementById('editRoomId').value;
            const data = {
                maintenance_charge: document.getElementById('editMaint').value,
                parking_charge: document.getElementById('editPark').value
            };

            await fetch(`/api/residents/${id}/charges`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });
            
            closeModal();
            fetchRealData();
        }

        async function togglePayment(room, status, amount) {
            setLoading(true);
            const month = new Date().toLocaleString('default', { month: 'long', year: 'numeric' });
            await fetch('/api/payments/record', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ flat_number: room, amount, month })
            });
            fetchRealData();
        }

        function closeModal() { document.getElementById('editModal').classList.remove('modal-active'); }
        function setLoading(l) { document.getElementById('loadingOverlay').className = l ? 'absolute inset-0 bg-white/60 backdrop-blur-md z-10 flex items-center justify-center flex-col gap-4' : 'hidden'; }
        document.getElementById('extraChargesInput').addEventListener('input', renderBilling);
        window.onload = fetchRealData;
    </script>
</body>
</html>
