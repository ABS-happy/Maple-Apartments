<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple Apartments - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .welcome-num {
            color: var(--primary);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="welcome-card">
            <i class="fa-solid fa-leaf logo-icon"></i>
            <h2>Welcome Room <span id="room-display" class="welcome-num">---</span></h2>
            <p>You have successfully logged into the Maple Apartments resident portal.</p>
            
            <div class="dashboard-actions">
                <button id="logout-btn" class="logout-btn">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout Portal
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const roomSession = localStorage.getItem('roomSession');
            const roomDisplay = document.getElementById('room-display');
            const logoutBtn = document.getElementById('logout-btn');

            if (!roomSession) {
                // Not logged in, redirect to login page
                window.location.href = 'index.html';
                return;
            }

            roomDisplay.textContent = roomSession;

            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('roomSession');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
